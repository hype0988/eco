<meta name="claude:viewport-fit-sides" content="cover">
<title>EcoColeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: app de celular em coluna única, tema verde escuro como na referência do usuário (EcoColeta),
   cartões arredondados, barra de abas fixa embaixo e croqui do bairro com zoom, rota pelas ruas e caminhão. */
:root {
  --bg: #07251B;
  --surface: #0D3426;
  --surface-2: #12432F;
  --line: #1C5A42;
  --ink: #EAF7EF;
  --muted: #9CC2B0;
  --accent: #2BD576;
  --on-accent: #04210F;
  --accent-text: #4FE08F;
  --hero: #17803F;
  --hero-ink: #FFFFFF;
  --hero-muted: #EEFAF3;
  --lc-bg: #F1F8F4;
  --lc-ink: #0C2A1F;
  --lc-muted: #4C6A5C;
  --warn-bg: #3A2012;
  --warn-line: #E8892B;
  --warn-ink: #FFD6AD;
  --danger: #FF8F86;
  --focus: #8CC4FF;
  --nav: #0A2D21;
  --truck: #F2B01E;
  --truck-ink: #241A00;
  --route: #3B9BFF;
  --map-land: #0A2018;
  --map-block: #123327;
  --map-s: #1E4B3A;
  --map-n: #2A6350;
  --map-hwy: #3A7CA8;
  --map-txt: #9FC4B3;
  --map-ink: #E4F4EC;
  --map-com: #7FB1D6;
  --map-in: #2A5F4D;
  --map-edge: #0A241A;
  --map-hwy-d: #2B6288;
  --font-display: 'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEF6F1; --surface: #FFFFFF; --surface-2: #E3F0E8; --line: #C5DACD; --ink: #0C2A1F; --muted: #4D6A5C;
    --accent: #1FBF65; --on-accent: #03200E; --accent-text: #0E7A41;
    --lc-bg: #FFFFFF; --warn-bg: #FFF0E0; --warn-line: #C2610C; --warn-ink: #6E3400;
    --danger: #B3261E; --focus: #0B5FD6; --nav: #FFFFFF; --route: #1769D6;
    --map-land: #D3E5DA; --map-block: #E8EFEA; --map-s: #C6D9CE; --map-n: #B4CBBE; --map-hwy: #8FB0CC; --map-in: #FFFFFF; --map-edge: #C3D6CB; --map-hwy-d: #6F93B3;
    --map-txt: #4A665A; --map-ink: #0C2A1F; --map-com: #3C6E96;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EEF6F1; --surface: #FFFFFF; --surface-2: #E3F0E8; --line: #C5DACD; --ink: #0C2A1F; --muted: #4D6A5C;
  --accent: #1FBF65; --on-accent: #03200E; --accent-text: #0E7A41;
  --lc-bg: #FFFFFF; --warn-bg: #FFF0E0; --warn-line: #C2610C; --warn-ink: #6E3400;
  --danger: #B3261E; --focus: #0B5FD6; --nav: #FFFFFF; --route: #1769D6;
  --map-land: #D3E5DA; --map-block: #E8EFEA; --map-s: #C6D9CE; --map-n: #B4CBBE; --map-hwy: #8FB0CC; --map-in: #FFFFFF; --map-edge: #C3D6CB; --map-hwy-d: #6F93B3;
  --map-txt: #4A665A; --map-ink: #0C2A1F; --map-com: #3C6E96;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ic { width: 22px; height: 22px; flex: none; }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 88px; }
.app > * { min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }

/* Cabeçalhos */
.top { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.top h1 { font-size: 1.4rem; font-weight: 600; }
.top .ic { width: 28px; height: 28px; color: var(--accent-text); }
.back { background: none; border: 0; width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
.brand { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; }
.brand b { color: var(--accent-text); font-weight: 600; }
.logo { width: 30px; height: 34px; }
.hello { font-size: 1.7rem; font-weight: 600; line-height: 1.15; }
.lead { margin: 6px 0 0; color: var(--ink); max-width: 36ch; }

/* Cartões */
.card { border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; }
button.row { cursor: pointer; }
.ibox { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.ibox .ic { width: 24px; height: 24px; }
.rt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.rt1 { font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; overflow-wrap: anywhere; }
.rt2 { color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
.chv { flex: none; display: grid; place-items: center; }
.c-hero { background: var(--hero); border-color: var(--hero); color: var(--hero-ink); }
.c-hero .ibox { background: rgba(255, 255, 255, 0.18); color: var(--hero-ink); }
.c-hero .rt2 { color: var(--hero-muted); }
.c-light { background: var(--lc-bg); border-color: var(--line); color: var(--lc-ink); }
.c-light .ibox { background: #E1EFE7; color: #0E7A41; }
.c-light .rt2 { color: var(--lc-muted); }
.aviso { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: 0.92rem; }
.aviso.sim { border: 1.5px solid var(--truck); color: var(--ink); }
.aviso.sim strong { font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent-text); text-decoration: underline; cursor: pointer; }

/* Seções e listas */
.sec h2, .sec-t { font-size: 1.12rem; font-weight: 600; margin-bottom: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-h h2 { font-size: 1.12rem; font-weight: 600; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.pl { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; min-height: 52px; text-align: left; cursor: pointer; }
.pl .ic { color: var(--accent-text); }
.pl .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pl .hr { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.vazio { margin: 0; color: var(--muted); }
.lista { display: flex; flex-direction: column; gap: 10px; }

/* Chips e abas internas */
.fchips { display: flex; flex-wrap: wrap; gap: 8px; }
.fc { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; }
.fc[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.fc small { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-left: 6px; opacity: 0.8; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 999px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 16px; min-height: 48px; color: var(--muted); }
.search:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--ink); font: inherit; font-size: 16px; outline: none; padding: 10px 0; }

/* Marcadores de tipo de coleta */
.mk { display: inline-block; width: 11px; height: 11px; flex: none; }
.mk.q { background: var(--map-com); border-radius: 2px; }
.mk.c { background: var(--accent); border-radius: 50%; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.8rem; font-weight: 500; white-space: nowrap; }
.pill.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.c-light .pill { border-color: #C5DACD; }

/* Cartão de bairro (Horários) */
.bcard { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 12px; }
.bmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; text-align: left; cursor: pointer; padding: 8px 0; }
.bmain > .ic { color: var(--accent-text); width: 26px; height: 26px; }
.bt { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.bt strong { font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; overflow-wrap: anywhere; }
.bt .sub { color: var(--muted); font-variant-numeric: tabular-nums; }
.icbtn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 0; background: none; color: var(--muted); cursor: pointer; }
.dia-h { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; }
.dia-h h3 { font-size: 1.05rem; font-weight: 600; text-transform: capitalize; }
.dia-bloco { display: flex; flex-direction: column; gap: 8px; }

/* Fotos e ilustrações */
.ilu { display: block; width: 100%; height: auto; border-radius: 14px; }
.foto { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 9; background: var(--surface-2); }
.foto img, .foto .ilu { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 0; }
.ibox.thumb { padding: 0; overflow: hidden; }
.ibox.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vh { position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; }
.vh:focus-visible + .btn { outline: 3px solid var(--focus); outline-offset: 2px; }
.bins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; margin-top: 12px; }
.bin { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.bin svg { width: 34px; height: 40px; }
.bin strong { font-size: 0.92rem; font-weight: 600; }
.bin small { color: var(--muted); font-size: 0.78rem; line-height: 1.25; }

/* Croqui */
.mapbox { position: relative; }
.mapa { width: 100%; height: auto; aspect-ratio: 4 / 5; display: block; border-radius: 14px; touch-action: none; border: 1px solid var(--line); user-select: none; -webkit-user-select: none; background: var(--map-land); }
.mapa.mini { aspect-ratio: 16 / 9; pointer-events: none; margin-top: 14px; touch-action: auto; }
.mapa.marcando { cursor: crosshair; outline: 3px solid var(--truck); outline-offset: 2px; }
.mapa .terra { fill: var(--map-land); }
.mapa .mancha { fill: var(--map-block); }
.mapa .rua-s { fill: none; stroke: var(--map-in); stroke-width: 6.6; stroke-linecap: round; stroke-linejoin: round; }
.mapa .quadra { fill: var(--map-block); stroke: var(--map-edge); stroke-width: 0.8; stroke-linejoin: round; }
.mapa .rodovia-c { fill: none; stroke: var(--map-hwy-d); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
.mapa .rodovia { fill: none; stroke: var(--map-hwy); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.mapa .rodovia-d { fill: none; stroke: var(--map-ink); stroke-opacity: 0.5; stroke-width: 0.9; stroke-dasharray: 5 5; stroke-linejoin: round; }
.mapa .rl, .mapa .ll, .mapa .rr {
  font-family: var(--font-body); font-weight: 500; fill: var(--map-txt); text-anchor: middle; dominant-baseline: central;
  stroke: var(--map-block); stroke-width: 3; paint-order: stroke; stroke-linejoin: round;
}
.mapa .rl { font-size: 9px; }
.mapa .rr { font-size: 8.5px; font-weight: 600; fill: var(--map-hwy); }
.mapa .ll { font-size: 8px; font-weight: 600; fill: var(--map-ink); }
.mapa .esc { fill: var(--accent); stroke: var(--map-block); stroke-width: 1.5; }
.mapa .com { fill: var(--map-com); stroke: var(--map-block); stroke-width: 1.5; }
.mapa .rota-fundo { fill: none; stroke: var(--map-block); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.95; }
.mapa .rota-plan { fill: none; stroke: var(--route); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.45; }
.mapa .rota-feita { fill: none; stroke: var(--route); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.mapa .pin { cursor: pointer; }
.mapa .pin .corpo { fill: var(--accent); stroke: #FFFFFF; stroke-width: 1.2; stroke-linejoin: round; }
.mapa .pin .psom { fill: #000; opacity: 0.35; }
.mapa .pin .miolo { fill: #FFFFFF; }
.mapa .pin text { fill: #0B3D27; font-family: var(--font-display); font-weight: 800; font-size: 7px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mapa .pin .ok { fill: none; stroke: #FFFFFF; stroke-width: 1.600; stroke-linecap: round; stroke-linejoin: round; }
.mapa .pin.passou .corpo { fill: #5F8F7A; }
.mapa .pin.passou .miolo { fill: #5F8F7A; }
.mapa .pin .halo { fill: none; stroke: var(--accent); stroke-width: 1.800; }
.mapa .pin.prox .corpo { stroke-width: 1.600; }
.mapa .sombra { fill: #000; opacity: 0.3; }
.mapa .cam { fill: var(--truck); stroke: #FFFFFF; stroke-width: 2.600; }
.mapa .pulso { fill: #1C9B5B; opacity: 0.35; transform-box: fill-box; transform-origin: center; animation: pulso 1.8s ease-out infinite; }
@keyframes pulso { from { transform: scale(0.85); opacity: 0.5; } to { transform: scale(1.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mapa .pulso { animation: none; } }
.mapa .truck .corpo { fill: #1C9B5B; }
.mapa .truck .borda { fill: #FFFFFF; stroke: #FFFFFF; stroke-width: 4; stroke-linejoin: round; }
.mapa .truck .cab { fill: #14804A; }
.mapa .truck .vid { fill: #7CC3E6; }
.mapa .truck .faixa { fill: #F2B01E; }
.mapa .truck .folha { fill: #1C9B5B; }
.mapa .truck .roda { fill: #1A1F1C; stroke: #FFFFFF; stroke-width: 1.6; }
.mapa .truck .cubo { fill: #B9C4BE; }
.mapa .truck.parado { opacity: 0.92; }
.mapa .tbg { fill: var(--lc-bg); stroke: var(--map-s); stroke-width: 1; }
.mapa .ttx { fill: var(--lc-ink); font-family: var(--font-body); font-weight: 600; font-size: 8.5px; text-anchor: middle; dominant-baseline: central; }
.mapa .anel { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.mapa .casa-h { fill: var(--route); opacity: 0.28; }
.mapa .casa { fill: var(--route); stroke: var(--map-block); stroke-width: 2; }
.mctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.zb { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.north { position: absolute; left: 10px; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; color: var(--ink); pointer-events: none; }
.marca-msg { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--truck); color: var(--truck-ink); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.marca-msg .link { color: var(--truck-ink); font-weight: 600; }
.mapa-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.st-rota { color: var(--accent-text) !important; font-weight: 600; }
.barra { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 12px; }
.barra i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.nota { margin: 0; color: var(--muted); font-size: 0.88rem; }
.sempos { color: var(--danger); font-weight: 600; }
.minicard { display: block; width: 100%; text-align: left; cursor: pointer; }
.sim-card input[type="range"] { width: 100%; accent-color: var(--accent); margin: 8px 0; min-height: 32px; }
.sim-lbl { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; font-variant-numeric: tabular-nums; margin: 4px 0 0; }

/* Linha do trajeto */
.estado { margin: 0 0 12px; font-weight: 500; }
.rota { list-style: none; margin: 0; padding: 0; }
.stop { display: grid; grid-template-columns: 3.7rem 1.6rem minmax(0, 1fr); column-gap: 8px; align-items: start; }
.stop .t { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.4; font-variant-numeric: tabular-nums; }
.stop .m { position: relative; align-self: stretch; display: flex; justify-content: center; }
.stop .m::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: var(--line); }
.stop:first-child .m::before { top: 0.85rem; }
.stop:last-child .m::before { bottom: auto; height: 0.85rem; }
.stop:only-child .m::before { display: none; }
.stop .dot { position: relative; margin-top: 0.42rem; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.stop .rua { padding: 2px 0 12px; font-size: 1.02rem; overflow-wrap: anywhere; }
.stop.passou .t, .stop.passou .rua { color: var(--muted); }
.stop.passou .dot { background: var(--line); border-color: var(--line); }
.stop.atual .dot { width: 24px; height: 24px; margin-top: 0.28rem; background: var(--truck); border-color: var(--ink); }
.stop.atual .t, .stop.atual .rua { font-weight: 600; }
.aqui { display: inline-block; margin-left: 8px; background: var(--truck); color: var(--truck-ink); font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; vertical-align: 2px; white-space: nowrap; }
.ml { display: block; background: none; border: 0; padding: 6px 0; min-height: 36px; font-size: 0.88rem; color: var(--accent-text); text-decoration: underline; cursor: pointer; text-align: left; }

/* Detalhes do ponto */
.nome-ponto { font-size: 1.5rem; font-weight: 600; line-height: 1.15; }
.info2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.info2 > div { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.info2 .ic { color: var(--accent-text); margin-top: 2px; }
.info2 small { display: block; color: var(--muted); font-size: 0.82rem; }
.info2 strong { font-weight: 600; overflow-wrap: anywhere; }
.checks { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; }
.checks .ic { color: var(--accent-text); width: 20px; height: 20px; margin-top: 2px; }
.sub-t { margin: 14px 0 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.warn { display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); border: 1.5px solid var(--warn-line); color: var(--warn-ink); }
.warn .ic { color: var(--warn-line); margin-top: 2px; }
.warn p { margin: 0; }

/* Botões */
.btn { min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--accent-text); background: none; color: var(--accent-text); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.perigo { border-color: var(--danger); color: var(--danger); }
.btn.blk { width: 100%; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.conf { margin: 0; font-weight: 500; }
.dica { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }

/* Formulário */
form { display: flex; flex-direction: column; gap: 18px; }
form label.rot, legend { font-weight: 600; display: block; margin-bottom: 6px; padding: 0; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
input[type="text"], textarea {
  width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px;
}
textarea { line-height: 1.5; resize: vertical; min-height: 9rem; }
.dias { display: flex; flex-wrap: wrap; gap: 6px; }
.dp { position: relative; }
.dp input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.dp span {
  display: flex; align-items: center; justify-content: center; min-width: 46px; min-height: 44px; padding: 0 8px;
  border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; cursor: pointer;
}
.dp input:checked + span { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dp input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.erro { margin: 0; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--danger); color: var(--danger); font-weight: 500; }

/* Perfil */
.avatar { display: flex; align-items: center; gap: 14px; }
.avatar .big { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-2); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.avatar .big .ic { width: 32px; height: 32px; }
.avatar strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; display: block; }
.det { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.det summary { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; font-weight: 600; list-style: none; }
.det summary::-webkit-details-marker { display: none; }
.det summary .ic:first-child { color: var(--accent-text); }
.det summary .chv { margin-left: auto; transition: transform 0.15s; }
.det[open] summary .chv { transform: rotate(90deg); }
.det .corpo { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); }
.det .corpo p { margin: 0; }
.rodape { margin: 0; color: var(--muted); font-size: 0.85rem; text-align: center; }

/* Barra de abas */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--nav); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; padding: 6px 2px; color: var(--muted); font-size: 0.72rem; font-weight: 500; cursor: pointer; border-radius: 12px; }
.tab .ic { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent-text); font-weight: 600; }

@media (prefers-reduced-motion: no-preference) {
  .stop.atual .dot { animation: pulso 2s ease-out infinite; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(242, 176, 30, 0.7); } 100% { box-shadow: 0 0 0 12px rgba(242, 176, 30, 0); } }
  .mapa .halo, .mapa .anel { animation: anel 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes anel { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.4; } }
}

  /* ---------- utilidades ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toMin(h) { var p = h.split(':'); return +p[0] * 60 + +p[1]; }
  function fmt(m) { m = Math.floor(m); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/\./g, ' ').replace(/\b(rua|r|travessa|tv|avenida|av|rodovia|praca|pc)\b/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function nowMin(a) { return a.getHours() * 60 + a.getMinutes() + a.getSeconds() / 60; }
  function etaTxt(m) {
    m = Math.max(0, Math.ceil(m - 0.0001));
    if (m < 1) return 'agora';
    if (m < 60) return 'em ' + m + ' min';
    return 'em ' + Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min';
  }
  function validRota(r) { return r && typeof r.h === 'string' && /^\d{2}:\d{2}$/.test(r.h) && typeof r.rua === 'string'; }
  function validBairro(b) {
    return b && typeof b.nome === 'string' && Array.isArray(b.comum) && Array.isArray(b.seletiva) && Array.isArray(b.rota);
  }
  function limpa(b) {
    return { id: String(b.id || ('b' + Math.random().toString(36).slice(2, 8))), nome: b.nome, exemplo: b.exemplo ? true : undefined,
      comum: b.comum.filter(function (n) { return n >= 0 && n <= 6; }), seletiva: b.seletiva.filter(function (n) { return n >= 0 && n <= 6; }),
      rota: b.rota.filter(validRota).map(function (r) {
        var o = { h: r.h, rua: r.rua };
        if (r.pos && typeof r.pos.x === 'number' && typeof r.pos.y === 'number') o.pos = { x: r.pos.x, y: r.pos.y };
        return o;
      }).sort(function (a, b2) { return toMin(a.h) - toMin(b2.h); }) };
  }

  /* Relógio do app: o horário real, ou o simulado no modo demonstração. */
  function agoraNow() {
    if (!state.sim) return new Date();
    var r = new Date(), diff = (state.sim.dow - r.getDay() + 7) % 7;
    var m = state.sim.min;
    return new Date(r.getFullYear(), r.getMonth(), r.getDate() + diff, Math.floor(m / 60), Math.floor(m % 60), Math.floor((m % 1) * 60));
  }

  function load() {
    var ok = false;
    try {
      var raw = localStorage.getItem(KEY) || localStorage.getItem(KEY_OLD);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.bairros)) {
          state.bairros = d.bairros.filter(validBairro).map(limpa);
          state.sel = d.sel;
          if (d.casa && typeof d.casa.x === 'number' && typeof d.casa.y === 'number') state.casa = d.casa;
          ok = true;
        }
      }
    } catch (e) {}
    if (!ok) { state.bairros = clone(EXEMPLOS); state.sel = state.bairros[0].id; }
    if (!state.bairros.some(function (b) { return b.id === state.sel; })) {
      state.sel = state.bairros.length ? state.bairros[0].id : null;
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ bairros: state.bairros, sel: state.sel, casa: state.casa })); } catch (e) {}

  /* ---------- ruas do croqui como grafo, para a rota seguir as ruas ---------- */
  var GRAFO = null;
  function segInter(a, b, c, d) {
    var rx = b[0] - a[0], ry = b[1] - a[1], sx = d[0] - c[0], sy = d[1] - c[1];

  function nearestOnSeg(p, a, b) {

  function grafo() {

    roads.push(CROQUI.rodovia);

    for (i = 0; i < segs.length; i++) {

  /* ---------- onde está o caminhão ---------- */
  function truckInfo(b, agora) {

  /* ---------- render ---------- */
  function navHTML() {
    return '<nav class="nav" aria-label="Seções do app"><div class="nav-in">' + TABS.map(function (t) {
      return '<button class="tab" data-a="tab" data-t="' + t.id + '"' + (state.tab === t.id && !state.edit ? ' aria-current="page"' : '') + '>' + ic(t.ic) + '<span>' + t.nome + '</span></button>';
    }).join('') + '</div></nav>';
  }
  function focusKey(el) {
    if (!el || !el.getAttribute) return null;
    if (el.id) return '#' + el.id;
    var a = el.getAttribute('data-a');
    if (!a) return null;
    var k = '[data-a="' + a + '"]';
    ['t', 'id', 'i', 'f', 'd'].forEach(function (n) { if (el.dataset && el.dataset[n] !== undefined) k += '[data-' + n + '="' + el.dataset[n] + '"]'; });
    return k;
  }
  function render(keepFocus) {
    var key = keepFocus ? focusKey(document.activeElement) : null;
    var agora = agoraNow(), h;
    if (state.edit) h = formHTML();
    else if (state.ponto) h = detalheHTML(agora);
    else if (state.tab === 'mapa') h = mapaTabHTML(agora);
    else if (state.tab === 'pontos') h = pontosTabHTML(agora);
    else if (state.tab === 'horarios') h = horariosTabHTML(agora);
    else if (state.tab === 'perfil') h = perfilTabHTML();
    else h = inicioHTML(agora);
    if (state.sim) h = h.replace('</header>', '</header>' + simBanner());
    app.innerHTML = '<main class="app">' + h + '</main>' + navHTML();
    if (key) { try { var el = app.querySelector(key); if (el) el.focus({ preventScroll: true }); } catch (e) {} }
  }
  function topo() { try { window.scrollTo(0, 0); } catch (e) {} }
  function irAoMapa() { try { var el = document.getElementById('mapa-svg'); if (el) el.scrollIntoView({ block: 'center' }); } catch (e) {} }
  function tabDoHash() {
    var h = '';
    try { h = (location.hash || '').replace('#', ''); } catch (e) {}
    return TABS.some(function (t) { return t.id === h; }) ? h : null;
  }
  function pararPlay() { if (state.sim) state.sim.play = false; }
  function go(tab) {
    state.tab = tab; state.ponto = null; state.edit = null; state.confirmDel = false; state.confirmReset = false;
    if (tab !== 'mapa') { state.mark = null; state.destaque = null; pararPlay(); } else state.vb = null;
    try { if (location.hash !== '#' + tab) location.hash = tab; } catch (e) {}
    render();
    topo();
  }

  /* ---------- ações ---------- */
  function salvarForm() {
    var erroEl = document.getElementById('form-erro');
    function falha(m) { erroEl.textContent = m; erroEl.hidden = false; }
    var nome = document.getElementById('f-nome').value.trim();
    var comum = [], seletiva = [];
    for (var i = 0; i < 7; i++) {
      if (document.getElementById('c' + i).checked) comum.push(i);
      if (document.getElementById('s' + i).checked) seletiva.push(i);
    }
    var antigos = state.edit === 'novo' ? [] : porId(state.edit).rota;
    var r = parseRota(document.getElementById('f-rota').value, antigos);
    if (!nome) return falha('Escreva o nome do bairro.');
    if (!comum.length && !seletiva.length) return falha('Marque ao menos um dia de coleta.');
    if (r.erro) return falha(r.erro);
    if (!r.rota.length) return falha('Adicione ao menos uma parada na rota, com o horário na frente.');
    if (state.edit === 'novo') {
      var id = 'b' + Date.now().toString(36);
      state.bairros.push({ id: id, nome: nome, comum: comum, seletiva: seletiva, rota: r.rota });
      state.sel = id;
    } else {
      var b = porId(state.edit);
      b.nome = nome; b.comum = comum; b.seletiva = seletiva; b.rota = r.rota;
      delete b.exemplo;
    }
    save();
    go('horarios');
  }

  app.addEventListener('click', function (e) {
    var sv = e.target.closest('svg.mapa');
    if (sv && state.arrastou) { state.arrastou = false; return; }
    if (sv && state.mark && state.vb && !sv.classList.contains('mini')) {
      var rc = sv.getBoundingClientRect(), v = state.vb, hh = v.w / ASPECT;
      var x = Math.max(0, Math.min(CROQUI.w, v.cx - v.w / 2 + (e.clientX - rc.left) / rc.width * v.w));
      var y = Math.max(0, Math.min(CROQUI.h, v.cy - hh / 2 + (e.clientY - rc.top) / rc.height * hh));
      var p = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
      if (state.mark.t === 'casa') state.casa = p;
      else { var b0 = atual(); if (b0 && b0.rota[state.mark.i]) b0.rota[state.mark.i].pos = p; }
      state.mark = null;
      save();
      render();
      return;
    }
    var t = e.target.closest('[data-a]');
    if (!t) return;
    var a = t.dataset.a;
    if (a === 'tab') go(t.dataset.t);
    else if (a === 'sel-bairro') { state.sel = t.dataset.id; state.destaque = null; state.mark = null; state.vb = null; state.seguir = false; save(); render(true); }
    else if (a === 'sel-mapa') { state.sel = t.dataset.id; save(); go('mapa'); }
    else if (a === 'ir-horarios') { state.dia = t.dataset.d; go('horarios'); }
    else if (a === 'ponto') { state.ponto = { b: t.dataset.id, i: +t.dataset.i }; state.fotoErro = ''; pararPlay(); render(); topo(); }
    else if (a === 'voltar') { state.ponto = null; render(); }
    else if (a === 'ver-mapa') {
      state.sel = t.dataset.id; save(); state.tab = 'mapa'; state.ponto = null; state.seguir = false;
      state.destaque = { b: t.dataset.id, i: +t.dataset.i };
      var bb = porId(t.dataset.id), ps = bb && bb.rota[+t.dataset.i] ? posDe(bb.rota[+t.dataset.i]) : null;
      state.vb = ps ? { cx: ps.x, cy: ps.y, w: 150 } : null;
      try { location.hash = 'mapa'; } catch (er) {}
      render(); irAoMapa();
    }
    else if (a === 'filtro') { state.filtro = t.dataset.f; render(true); }
    else if (a === 'dia') { state.dia = t.dataset.d; render(true); }
    else if (a === 'editar') { state.edit = t.dataset.id; state.confirmDel = false; render(); topo(); }
    else if (a === 'novo') { state.edit = 'novo'; render(); topo(); }
    else if (a === 'cancelar-form') { state.edit = null; state.confirmDel = false; render(); topo(); }
    else if (a === 'excluir') { state.confirmDel = true; render(); }
    else if (a === 'excluir-nao') { state.confirmDel = false; render(); }
    else if (a === 'excluir-ok') {
      state.bairros = state.bairros.filter(function (b) { return b.id !== state.edit; });
      if (!atual()) state.sel = state.bairros.length ? state.bairros[0].id : null;
      state.confirmDel = false; save(); go('horarios');
    }
    else if (a === 'limpar-exemplos') {
      state.bairros = state.bairros.filter(function (b) { return !b.exemplo; });
      if (!atual()) state.sel = state.bairros.length ? state.bairros[0].id : null;
      save(); render();
    }
    else if (a === 'marcar-parada') { state.mark = { t: 'parada', i: +t.dataset.i }; render(); irAoMapa(); }
    else if (a === 'marcar-casa') { state.mark = { t: 'casa' }; state.tab = 'mapa'; state.ponto = null; state.edit = null; state.vb = null; try { location.hash = 'mapa'; } catch (er2) {} render(); irAoMapa(); }
    else if (a === 'cancelar-marca') { state.mark = null; render(); }
    else if (a === 'remover-casa') { state.casa = null; save(); render(); }
    else if (a === 'comercios') { state.comercios = !state.comercios; render(true); }
    else if (a === 'zoom-in' || a === 'zoom-out') {
      var s2 = document.getElementById('mapa-svg');
      if (s2 && state.vb) { var r2 = s2.getBoundingClientRect(); pararSeguir(); zoomEm(r2.left + r2.width / 2, r2.top + r2.height / 2, a === 'zoom-in' ? 0.7 : 1 / 0.7, s2); }
    }
    else if (a === 'recentrar') {
      var b3 = atual();
      if (b3) { state.vb = fitBounds(fitPts(b3), ASPECT, 40, 140); state.seguir = false; render(true); }
    }
    else if (a === 'seguir') {
      state.seguir = !state.seguir;
      var b4 = atual(), T = b4 ? truckInfo(b4, agoraNow()) : null;
      if (state.seguir && T) state.vb = { cx: T.x, cy: T.y, w: Math.min(state.vb ? state.vb.w : 170, 170) };
      render(true);
    }
    else if (a === 'foto-remover') {
      var bf = state.ponto && porId(state.ponto.b), rf = bf && bf.rota[state.ponto.i];
      if (rf) { delete FOTOS[fotoKey(bf, rf)]; salvaFotos(); state.fotoErro = ''; render(); }
    }
    else if (a === 'sim-on') {
      var b5 = atual(), rs = b5 ? proximaSaida(b5, new Date()) : null, hoje0 = new Date();
      state.sim = { dow: rs ? rs.data.getDay() : hoje0.getDay(), min: rs ? rs.ini : 7 * 60, play: false };
      render();
    }
    else if (a === 'sim-off') { state.sim = null; render(); }
    else if (a === 'sim-dia') { state.sim.dow = +t.dataset.d; render(true); }
    else if (a === 'sim-play') {
      state.sim.play = !state.sim.play;
      if (state.sim.play && state.sim.min >= 1438) state.sim.min = 0;
      var pb = document.getElementById('sim-play');
      if (pb) pb.innerHTML = state.sim.play ? ic('pause') + 'Pausar' : ic('play') + 'Reproduzir';
    }
    else if (a === 'reset') { state.confirmReset = true; render(); }
    else if (a === 'reset-nao') { state.confirmReset = false; render(); }
    else if (a === 'reset-ok') {
      state.bairros = clone(EXEMPLOS); state.sel = state.bairros[0].id; state.casa = null; state.confirmReset = false; state.vb = null;
      save(); render();
    }
  });
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.namespaceURI === 'http://www.w3.org/2000/svg') {
      var g = e.target.closest('[data-a]');
      if (g) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id !== 'f-foto' || !state.ponto) return;
    var f = e.target.files && e.target.files[0];
    var b = porId(state.ponto.b), r = b && b.rota[state.ponto.i];
    if (!f || !r) return;
    reduzFoto(f, function (url) {
      var k = fotoKey(b, r);
      if (!url) state.fotoErro = 'Não consegui abrir essa imagem. Tente outra foto.';
      else {
        var antiga = FOTOS[k];
        FOTOS[k] = url;
        if (!salvaFotos()) {
          if (antiga) FOTOS[k] = antiga; else delete FOTOS[k];
          state.fotoErro = 'Não coube: a memória do aparelho para fotos está cheia. Remova alguma foto e tente de novo.';
        } else state.fotoErro = '';
      }
      render();
    });
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'f-busca') {
      state.busca = e.target.value;
      var l = document.getElementById('lista-pontos');
      if (l) l.innerHTML = listaPontosHTML(agoraNow());
    } else if (e.target.id === 'sim-min' && state.sim) {
      state.sim.min = +e.target.value;
      renderMapaDyn();
    }
  });
  app.addEventListener('submit', function (e) {
    if (e.target.id !== 'form') return;
    e.preventDefault();
    salvarForm();
  });
  window.addEventListener('hashchange', function () {
    var t = tabDoHash();
    if (t && t !== state.tab) {
      state.tab = t; state.ponto = null; state.edit = null;
      if (t !== 'mapa') { state.mark = null; state.destaque = null; pararPlay(); } else state.vb = null;
      render(); topo();
    }
  });

  load();
  state.tab = tabDoHash() || 'inicio';
  render();

  var tick = 0;
  setInterval(function () {
    tick++;
    if (state.edit || state.ponto) return;
    if (state.tab === 'mapa') { renderMapaDyn(); return; }
    if (tick % 20 !== 0) return;
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
    render(true);
  }, 1000);
  setInterval(function () {
    if (!state.sim || !state.sim.play || state.tab !== 'mapa') return;
    state.sim.min += 1;
    if (state.sim.min >= 1439) { state.sim.min = 1439; state.sim.play = false; var pb = document.getElementById('sim-play'); if (pb) pb.innerHTML = ic('play') + 'Reproduzir'; }
    renderMapaDyn();
  }, 250);
})();
</script>
